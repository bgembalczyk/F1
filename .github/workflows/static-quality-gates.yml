name: Static quality gates

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  static-analysis:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install pre-commit
        run: |
          python -m pip install --upgrade pip
          pip install pre-commit vulture

      - name: Run pre-commit on all files
        run: python -m pre_commit run --show-diff-on-failure --color=always --all-files

      - name: Enforce ADR references in architecture docs
        run: python scripts/ci/enforce_architecture_adr_reference.py

      - name: DI anti-pattern AST check
        shell: bash
        run: |
          CHANGED_FILES="$(git ls-files '*.py' | grep -E '^(layers/|scrapers/base/|scrapers/drivers/infobox/).+\.py$' || true)"
          if [ -z "$CHANGED_FILES" ]; then
            echo "No matching files for DI anti-pattern check."
            exit 0
          fi
          python scripts/check_di_antipatterns.py \
            --adr-reference-text "docs/adr/0003-di-strategy.md" \
            $CHANGED_FILES

      - name: Domain role contracts suite
        run: pytest -q tests/test_domain_role_contracts.py

      - name: Scraper family contracts suite
        run: pytest -q tests/contract/test_scraper_family_contracts.py

      - name: Enforce scraper family inheritance contracts
        run: python scripts/ci/enforce_scraper_family_contracts.py

      - name: Resolve base SHA for naming gate
        id: naming_shas
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
          else
            BASE_SHA="${{ github.event.before }}"
          fi

          if [[ -z "$BASE_SHA" || "$BASE_SHA" == "0000000000000000000000000000000000000000" ]]; then
            BASE_SHA="$(git rev-list --max-count=1 HEAD^)"
          fi

          echo "base_sha=$BASE_SHA" >> "$GITHUB_OUTPUT"
          echo "head_sha=${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Enforce new scraper module naming convention
        run: |
          CHANGED_FILES="$(git diff --name-only "${{ steps.naming_shas.outputs.base_sha }}" "${{ steps.naming_shas.outputs.head_sha }}" | paste -sd ',' -)"
          python -m scripts.ci.enforce_new_scraper_module_naming \
            --base-sha "${{ steps.naming_shas.outputs.base_sha }}" \
            --head-sha "${{ steps.naming_shas.outputs.head_sha }}" \
            --changed-files "$CHANGED_FILES"
